<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anbar | عنبر للعطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
            --white: #ffffff;
            --gray: #f9f9f9;
        }

        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--gray);
            color: var(--dark);
        }

        /* Header */
        header {
            background: var(--dark);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            text-decoration: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 400;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1541643600914-78b084683601?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); /* صورة تقريبية */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }

        .btn-gold {
            background-color: var(--gold);
            color: var(--dark);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        /* Products Section */
        .products {
            padding: 50px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-card h3 { margin: 15px 0; }

        .price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Footer / WhatsApp Section */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ANBAR</a>
        <nav>
            <a href="#home">الرئيسية</a>
            <a href="#shop">العطور</a>
            <a href="#contact">اتصل بنا</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>عنبر - سحر الروائح الشرقية</h1>
        <p>اكتشف تشكيلتنا الحصرية من العطور الفاخرة</p>
        <br>
        <a href="#shop" class="btn-gold">تسوق الآن</a>
    </section>

    <section class="products" id="shop">
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="عطر 1">
            <h3>عطر عنبر الملكي</h3>
            <p class="price">299 DH</p>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn-gold">طلب عبر واتساب</a>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="عطر 2">
            <h3>مسك الليل</h3>
            <p class="price">199 DH</p>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn-gold">طلب عبر واتساب</a>
        </div>
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="عطر 3">
            <h3>العود الأصيل</h3>
            <p class="price">350 DH</p>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" class="btn-gold">طلب عبر واتساب</a>
        </div>
    </section>

    <a href="https://wa.me/YOUR_PHONE_NUMBER" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer style="background: #1a1a1a; color: white; text-align: center; padding: 20px;">
        <p>&copy; 2026 Anbar Parfum - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
